name: E2E 문의 메일 발송 (주기/수동)

on:
  schedule:
    - cron: "0 23 * * 1"   # 매주 월 08:00 KST — 실제 메일 발송까지 확인
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  email:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps
        run: npm install
      - name: Run email send test
        env:
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
        run: npm run test:email
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: email-report-${{ github.run_id }}
          path: e2e/playwright-report/
          retention-days: 14
      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `🚨 문의 메일 발송 테스트 실패 (${new Date().toISOString().slice(0,10)})`,
              body: `Resend 실제 발송(emailed:true) 확인이 실패했습니다.\n로그: ${run}\nqwfsk 엣지함수 시크릿(RESEND_API_KEY)·Auth SMTP를 점검하세요.`,
              labels: ["e2e-failure"],
            });

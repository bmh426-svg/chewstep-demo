name: E2E 데일리 스모크 (chewstep.com)

on:
  schedule:
    - cron: "0 22 * * *"   # 매일 07:00 KST (UTC 22:00)
  workflow_dispatch: {}      # 수동 실행 버튼

permissions:
  contents: read
  issues: write             # 실패 시 이슈 생성

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm install

      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium

      - name: Run daily smoke
        env:
          BASE_URL: https://chewstep.com
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: npm test

      - name: Upload report & artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `🚨 E2E 데일리 스모크 실패 (${new Date().toISOString().slice(0,10)})`,
              body: `프로덕션 스모크가 실패했습니다.\n\n- 실행 로그/리포트: ${run}\n- 아티팩트(스크린샷·트레이스): 위 실행의 Artifacts에서 \`playwright-report-*\` 다운로드\n\n확인 항목: 메인/데모 접속·로그인·부모 라우팅·데모→결과화면·제품추천/JS404·prep/pitch·콘솔/네트워크·문의(dryRun).`,
              labels: ["e2e-failure"],
            });

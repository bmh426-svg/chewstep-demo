<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>비밀번호 재설정 · Chewstep</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A5%A3%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="/assets/css/site.css" />
<style>
  body { background:
      radial-gradient(60% 55% at 85% 8%,rgba(130,154,109,.06),transparent 70%),
      radial-gradient(50% 50% at 8% 100%,rgba(192,133,91,.05),transparent 70%),var(--bg-soft);
    min-height:100dvh; }
  .lwrap { max-width:440px; margin:0 auto; padding:32px 24px 60px; }
  .lbrand { display:flex; justify-content:center; margin:20px 0 28px; }
  .lbrand a { display:flex; align-items:center; gap:10px; font-weight:800; color:var(--ink); font-size:19px; text-decoration:none; }
  .lbrand .logo { width:30px;height:30px;border-radius:9px;background:linear-gradient(145deg,var(--brand),var(--brand-deep));display:grid;place-items:center;color:#fff; }
  .lcard { background:#fff; border:1px solid var(--line); border-radius:22px; padding:30px 28px; box-shadow:var(--shadow-lg); }
  .lcard h1 { color:var(--ink); font-size:23px; letter-spacing:-.02em; margin-bottom:6px; text-align:center; }
  .lcard .sub { color:var(--ink-soft); font-size:14px; text-align:center; margin-bottom:22px; line-height:1.55; }
  .field { margin-bottom:14px; }
  .field label { display:block; font-size:13px; font-weight:700; color:var(--ink); margin-bottom:6px; }
  .field input { width:100%; box-sizing:border-box; font-family:var(--font); font-size:15px; color:var(--ink);
    border:1px solid #d9e0dc; border-radius:12px; padding:13px 14px; }
  .field input:focus { border-color:var(--brand); outline:none; }
  .lcard .btn { width:100%; justify-content:center; margin-top:6px; }
  .hint { font-size:12px; color:var(--ink-soft); margin-top:-6px; margin-bottom:14px; }
  .lmsg { margin-top:14px; font-size:13px; padding:12px 14px; border-radius:10px; background:var(--amber-tint); color:#6b5518; border:1px solid #f0e2bf; display:none; line-height:1.55; }
  .lmsg.show { display:block; }
  .lmsg.ok { background:var(--brand-tint); color:var(--brand-deep); border-color:#bfe6d5; }
  .backhome { display:block; text-align:center; margin-top:22px; font-size:13px; color:var(--ink-soft); text-decoration:none; }
  .state { text-align:center; color:var(--ink-soft); padding:8px 0 4px; }
  .state .em { font-size:30px; }
</style>
</head>
<body>
<div class="lwrap">
  <div class="lbrand"><a href="/"><span class="logo">🥣</span> Chewstep</a></div>

  <div class="lcard">
    <h1>비밀번호 재설정</h1>
    <p class="sub">새로 사용할 비밀번호를 입력해 주세요.</p>

    <!-- 재설정 폼 (유효한 링크로 들어왔을 때만 표시) -->
    <form id="resetForm" novalidate style="display:none;">
      <div class="field">
        <label for="pw1">새 비밀번호</label>
        <input type="password" id="pw1" placeholder="8자 이상" autocomplete="new-password" />
      </div>
      <p class="hint">8자 이상으로 설정해 주세요.</p>
      <div class="field">
        <label for="pw2">새 비밀번호 확인</label>
        <input type="password" id="pw2" placeholder="한 번 더 입력" autocomplete="new-password" />
      </div>
      <button type="submit" class="btn btn-primary" id="saveBtn">비밀번호 변경하기 <span class="arrow">→</span></button>
    </form>

    <!-- 로딩/오류 상태 -->
    <div id="stateBox" class="state">
      <div class="em">⏳</div>
      <p style="margin-top:8px;">링크를 확인하는 중…</p>
    </div>

    <div class="lmsg" id="lmsg"></div>
  </div>

  <a class="backhome" href="/login.html">← 로그인으로 돌아가기</a>
</div>

<script type="module">
  import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

  // 사용자 계정 = B2B 운영 프로젝트 (login.html과 동일)
  const SB_URL = "https://qwfskemfsrkmlrdttvqy.supabase.co";
  const SB_KEY = "sb_publishable_5cL015aIZo-fRKwXM16RkQ_NbzkzibH";
  // detectSessionInUrl(기본 true)이 메일 링크의 복구 토큰(#access_token…&type=recovery)을 자동 처리한다.
  const sb = createClient(SB_URL, SB_KEY);

  const $ = (id) => document.getElementById(id);
  const form = $("resetForm"), stateBox = $("stateBox"), msg = $("lmsg");
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  function showMsg(html, ok) { msg.className = "lmsg show" + (ok ? " ok" : ""); msg.innerHTML = html; }
  function setState(em, text) { stateBox.style.display = "block"; stateBox.innerHTML = `<div class="em">${em}</div><p style="margin-top:8px;">${text}</p>`; }
  function showForm() { stateBox.style.display = "none"; form.style.display = ""; $("pw1").focus(); }
  function invalidLink(detail) {
    form.style.display = "none";
    setState("⚠️", "이 재설정 링크가 유효하지 않거나 만료됐어요.<br>로그인 화면에서 <b>‘비밀번호를 잊으셨나요?’</b>로 메일을 다시 받아 주세요.");
    if (detail) showMsg(esc(detail));
  }

  // 메일 링크에 에러가 실려오는 경우(#error=…&error_description=…) 먼저 확인
  const hash = new URLSearchParams((location.hash || "").replace(/^#/, ""));
  if (hash.get("error")) {
    invalidLink(hash.get("error_description") || hash.get("error"));
  } else {
    // 복구 세션이 잡히면(PASSWORD_RECOVERY 또는 세션 존재) 폼 노출
    let ready = false;
    sb.auth.onAuthStateChange((event, session) => {
      if (event === "PASSWORD_RECOVERY" || (session && !ready)) { ready = true; showForm(); }
    });
    // 폴백: 토큰 처리가 이미 끝난 경우 getSession으로 확인
    (async () => {
      await new Promise(r => setTimeout(r, 400)); // detectSessionInUrl 처리 대기
      const { data: { session } } = await sb.auth.getSession();
      if (session && !ready) { ready = true; showForm(); }
      else if (!ready) { invalidLink(); }
    })();
  }

  $("resetForm").addEventListener("submit", async function (e) {
    e.preventDefault();
    const p1 = $("pw1").value, p2 = $("pw2").value;
    if (p1.length < 8) { showMsg("비밀번호는 8자 이상으로 입력해 주세요."); return; }
    if (p1 !== p2) { showMsg("두 비밀번호가 일치하지 않아요."); return; }
    const btn = $("saveBtn"); btn.disabled = true;
    showMsg("변경하는 중…", true);
    const { error } = await sb.auth.updateUser({ password: p1 });
    if (error) {
      btn.disabled = false;
      showMsg("변경에 실패했어요.<br><span style='color:var(--ink-soft)'>" + esc(error.message || "") + "</span>");
      return;
    }
    form.style.display = "none";
    setState("✅", "비밀번호가 변경됐어요! 새 비밀번호로 로그인해 주세요.");
    showMsg("잠시 후 로그인 화면으로 이동합니다…", true);
    await sb.auth.signOut();           // 복구 세션 정리 후 정식 로그인 유도
    setTimeout(() => location.replace("/login.html"), 1800);
  });
</script>
</body>
</html>

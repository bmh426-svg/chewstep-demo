<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>우리 집 식습관 알려주기 · Chewstep</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%9A%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="/assets/css/site.css" />
<!--
  웹 가정 식습관 체크 (2026-08-08 신설)

  왜 웹에 만드나
    보호자 기기가 갤럭시인지 아이폰인지 알 수 없어 데모의 보호자 경로를 **웹으로 확정**했다.
    그런데 이 문항은 앱(screens/homecheck.js)에만 있었다 — 웹으로 오면 리포트를 개인화할
    기준값이 통째로 비었다. 문자로 "고민 한 줄 적어 보내주세요"는 회수되지 않는다.
    → 코드로 아이를 연결한 직후 이 화면에서 받는다.

  왜 기관 기록과 따로 받나
    같은 아이가 **원에서는 다 먹고 집에서는 안 먹는다**는 것이 이 서비스의 출발점이다.
    집의 기준값을 보호자에게 직접 받아 원의 기록과 나란히 놓고 본다.

  문항은 앱과 **같은 값 집합**이다(어긋나면 같은 아이의 답이 두 갈래가 된다).
    앱: chewstep-mobile/www/assets/js/screens/homecheck.js 의 STEPS
  저장: child_home_profiles (child_id, guardian_id) 유니크 · schema_version='homecheck-v1'
    RLS: chp_ins_guardian / chp_upd_guardian — 연결된 보호자 본인만.

  ★ 지키는 것
    1) 객관식은 비워 두고 넘어가지 않는다 — 빈 칸을 '보통'으로 추측하면 리포트가 거짓이 된다.
    2) 주관식은 선택이다. 억지로 받지 않는다.
    3) 검사가 아니라고 화면에서 말한다. 나중에 바꿀 수 있다고도 말한다.
-->
<style>
  body { background: var(--bg-soft); min-height:100dvh; }
  .hwrap { max-width:560px; margin:0 auto; padding:26px 18px 70px; }
  .hbrand { display:flex; justify-content:center; margin:8px 0 20px; }
  .hbrand a { display:flex; align-items:center; gap:9px; font-weight:800; color:var(--ink); font-size:18px; text-decoration:none; }
  .hbrand .logo { width:29px;height:29px;border-radius:9px;background:linear-gradient(145deg,var(--brand),var(--brand-deep));display:grid;place-items:center;color:#fff; }

  .hbar { height:6px; background:var(--line); border-radius:99px; overflow:hidden; margin-bottom:18px; }
  .hfill { height:100%; background:linear-gradient(90deg,var(--brand),var(--brand-deep)); transition:width .3s; }

  .eyebrow { font-size:12px; font-weight:800; color:var(--brand-deep); letter-spacing:.03em; }
  h1.title { color:var(--ink); font-size:23px; line-height:1.35; letter-spacing:-.02em; margin:6px 0 8px; }
  .lede { color:var(--ink-soft); font-size:14px; line-height:1.6; margin-bottom:20px; }

  .field { background:#fff; border:1px solid var(--line); border-radius:16px; padding:16px 18px; margin-bottom:12px; box-shadow:var(--shadow-sm); }
  .field .q { font-size:14.5px; font-weight:700; color:var(--ink); margin-bottom:10px; }
  .opts { display:grid; gap:8px; }
  .opt { display:flex; align-items:center; gap:10px; border:1px solid #e3ddd3; border-radius:11px; padding:11px 13px; cursor:pointer; font-size:14px; color:var(--ink-2); }
  .opt:has(input:checked) { border-color:var(--brand); background:var(--brand-tint); color:var(--ink); font-weight:600; }
  .opt input { accent-color:var(--brand-deep); width:17px; height:17px; flex:none; }
  .inp { width:100%; box-sizing:border-box; font-family:var(--font); font-size:15px; color:var(--ink);
    border:1px solid #d9e0dc; border-radius:11px; padding:12px 13px; }
  .inp:focus { border-color:var(--brand); outline:none; }

  .actions { display:flex; gap:10px; margin-top:18px; }
  .actions .btn { flex:1; justify-content:center; }
  .msg { margin-top:14px; font-size:13.5px; padding:12px 14px; border-radius:10px; display:none; line-height:1.55;
    background:var(--amber-tint); color:#6b5518; border:1px solid #f0e2bf; }
  .msg.show { display:block; }
  .msg.ok { background:var(--brand-tint); color:var(--brand-deep); border-color:#bfe6d5; }
  .note { font-size:12.5px; color:var(--ink-soft); line-height:1.6; margin-top:16px; }
  .loading, .state { text-align:center; color:var(--ink-soft); padding:64px 20px; }
  .state .em { font-size:34px; } .state h2 { color:var(--ink); font-size:19px; margin:14px 0 8px; }
</style>
</head>
<body>
<div class="hwrap">
  <div class="hbrand"><a href="/"><span class="logo">🥣</span> Chewstep</a></div>
  <div class="loading" id="loading">불러오는 중…</div>
  <div id="content" style="display:none;"></div>
</div>

<script type="module">
  import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
  const sb = createClient("https://qwfskemfsrkmlrdttvqy.supabase.co","sb_publishable_5cL015aIZo-fRKwXM16RkQ_NbzkzibH");

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  const show = (html) => { $("loading").style.display="none"; const c=$("content"); c.style.display="block"; c.innerHTML=html; };
  const state = (em,t,d,btn) => show(`<div class="state"><div class="em">${em}</div><h2>${esc(t)}</h2><p>${esc(d)}</p>${btn||""}</div>`);

  // 빈도는 앱·웹이 이미 쓰는 코드값 체계를 따른다(설문 v3 FREQ 와 같은 뜻).
  const FREQ = [["daily5","거의 매일 (주 5회 이상)"],["w34","주 3~4회"],["w12","주 1~2회"],
                ["m12","월 1~2회"],["rare","거의 없어요"],["unknown","잘 모르겠어요"]];

  // ⚠ 앱 screens/homecheck.js 의 STEPS 와 **값이 같아야 한다**. 바꿀 때 양쪽을 함께 고친다.
  const STEPS = [
    { key:"how", eyebrow:"1 / 5", title:"집에서는 어떻게 먹나요?", lede:"평소 모습을 알려주세요. 정답은 없어요.",
      fields:[
        { id:"duration", q:"한 끼에 걸리는 시간", type:"radio",
          opts:[["u10","10분 안쪽"],["m1020","10~20분"],["m2030","20~30분"],["o30","30분 넘게"],["vary","그날그날 달라요"]] },
        { id:"amount", q:"평소 먹는 양", type:"radio",
          opts:[["most","차린 만큼 거의 다"],["half","반 정도"],["little","몇 술 정도"],["vary","그날그날 달라요"]] },
        { id:"self", q:"스스로 먹는 정도", type:"radio",
          opts:[["self","혼자 먹어요"],["mix","혼자 먹다가 도와줘요"],["fed","먹여줘야 먹어요"]] },
      ] },
    { key:"concern", eyebrow:"2 / 5", title:"어떤 점이<br>가장 고민이세요?",
      lede:"가장 신경 쓰이는 것 하나를 고르고, 하고 싶은 말은 자유롭게 적어 주세요.",
      fields:[
        { id:"main", q:"가장 큰 고민", type:"radio",
          opts:[["spit","씹다가 뱉어요"],["nochew","잘 씹지 않고 삼켜요"],["slow","너무 오래 먹어요"],
                ["small","먹는 양이 적어요"],["picky","특정 음식만 먹어요"],["texture","새로운 식감을 거부해요"]] },
        { id:"freq", q:"그 모습이 나타나는 빈도", type:"radio", opts:FREQ },
        { id:"note", q:"선생님께 전하고 싶은 말 (선택)", type:"text",
          placeholder:"예: 저녁에 특히 심해요. 어린이집에서는 어떤지 궁금해요." },
      ] },
    { key:"foods", eyebrow:"3 / 5", title:"잘 먹는 음식과<br>어려워하는 음식",
      lede:"떠오르는 대로 적어 주세요. 주간 리포트에서 원의 기록과 나란히 보여드려요.",
      fields:[
        { id:"likes", q:"편하게 잘 먹는 음식", type:"text", placeholder:"예: 진밥, 계란찜, 바나나" },
        { id:"hard", q:"어려워하거나 자주 남기는 음식", type:"text", placeholder:"예: 고기, 나물, 국건더기" },
        { id:"allergy", q:"알레르기 · 절대 피해야 할 음식 (선택)", type:"text", placeholder:"예: 계란, 우유" },
      ] },
    { key:"texture", eyebrow:"4 / 5", title:"식감에는<br>어떻게 반응해요?",
      lede:"이 답이 리포트의 '더 친해질 음식' 조언 기준이 돼요.",
      fields:[
        { id:"form", q:"지금 주로 먹는 형태", type:"radio",
          opts:[["mashed","으깬 것 (부드럽게)"],["soft","무른 유아식"],["chopped","잘게 썬 것"],
                ["regular","어른과 거의 같은 가정식"],["unknown","잘 모르겠어요"]] },
        { id:"tough", q:"질기거나 퍽퍽한 음식(고기 등)", type:"radio",
          opts:[["ok","잘 먹어요"],["slow","오래 씹어요"],["spit","뱉어요"],["refuse","입에 넣지 않아요"]] },
        { id:"crunch", q:"아삭한 음식(생채소 등)", type:"radio",
          opts:[["ok","잘 먹어요"],["slow","오래 씹어요"],["spit","뱉어요"],["refuse","입에 넣지 않아요"]] },
        { id:"lump", q:"덩어리·알갱이가 섞인 음식", type:"radio",
          opts:[["ok","괜찮아요"],["pick","골라내요"],["spit","뱉어요"],["unknown","잘 모르겠어요"]] },
      ] },
    { key:"env", eyebrow:"5 / 5", title:"식사 환경과<br>보호자 도움", lede:"마지막이에요.",
      fields:[
        { id:"where", q:"주로 먹는 자리", type:"radio",
          opts:[["chair","아이 의자에 앉아서"],["table","식탁에 함께"],["move","돌아다니면서"],["vary","그날그날 달라요"]] },
        { id:"screen", q:"먹는 동안 영상·TV", type:"radio",
          opts:[["never","안 봐요"],["sometimes","가끔 봐요"],["always","거의 봐요"]] },
        { id:"together", q:"함께 먹는 사람", type:"radio",
          opts:[["family","가족이 같이 먹어요"],["watch","아이만 먹고 어른은 지켜봐요"],["alone","아이 혼자 먹어요"]] },
        { id:"help", q:"안 먹을 때 보호자의 대응", type:"radio",
          opts:[["wait","기다려요"],["feed","먹여줘요"],["persuade","달래거나 설득해요"],
                ["other","다른 음식을 줘요"],["stop","식사를 끝내요"]] },
      ] },
  ];

  const fieldHtml = (f, v) => f.type === "text"
    ? `<div class="field"><div class="q">${f.q}</div>
         <input class="inp" data-f="${f.id}" maxlength="120" value="${esc(v[f.id]||"")}" placeholder="${esc(f.placeholder||"")}" /></div>`
    : `<div class="field"><div class="q">${f.q}</div><div class="opts">${f.opts.map(([val,t]) =>
         `<label class="opt"><input type="radio" name="${f.id}" value="${val}"${v[f.id]===val?" checked":""}/><span>${t}</span></label>`
       ).join("")}</div></div>`;

  /* ── 부트 ─────────────────────────────────────────────────── */
  // 형제·자매를 한 계정에 여러 명 연결할 수 있다(코드가 아이 한 명당 하나이므로 코드도 여러 개).
  // 그래서 이 화면은 **아이별로** 답을 받는다 — 아이마다 집에서 먹는 모습이 다르다.
  const { data:{ session } } = await sb.auth.getSession();
  if (!session) { location.replace("/login.html?next=" + encodeURIComponent(location.pathname + location.search)); }
  else {
    const WANT = new URLSearchParams(location.search).get("child") || "";
    let childId = null, guardianId = null, childName = "우리 아이";
    let mine = [], done = new Set();
    let data = {}, i = 0;

    try {
      // 내 아이 + 내 보호자 행. guardians!inner 로 **내 연결 행만** 남긴다
      // (child_guardians 는 같은 아이의 다른 보호자 행까지 보인다).
      const { data: links, error } = await sb.from("child_guardians")
        .select("child_id, guardians!inner(id, profile_id), children(display_name)")
        .eq("guardians.profile_id", session.user.id);
      if (error) throw error;

      // 같은 아이가 두 줄로 오는 경우(관계가 둘)를 대비해 아이 기준으로 접는다
      const seen = new Set();
      mine = (links || []).filter((l) => l.child_id && !seen.has(l.child_id) && seen.add(l.child_id));

      if (!mine.length) {
        state("🔗","아직 연결된 아이가 없어요","어린이집에서 받은 초대 코드로 우리 아이를 먼저 연결해 주세요.",
          '<a class="btn btn-primary" href="/redeem.html">초대 코드 입력하기 →</a>');
      } else {
        // 이미 답한 아이 목록 (한 번에 조회 — 아이마다 왕복하지 않는다)
        const { data: profs } = await sb.from("child_home_profiles").select("child_id, answers");
        const byChild = new Map((profs || []).map((p) => [p.child_id, p.answers]));
        mine.forEach((l) => { if (byChild.has(l.child_id)) done.add(l.child_id); });

        // 이번에 받을 아이 정하기:
        //   ① 링크로 지정된 아이(연결 직후 redeem 이 넘겨준다)
        //   ② 아직 안 받은 아이 중 첫째
        //   ③ 전부 받았으면 리포트로 (이 화면에 머물 이유가 없다)
        let target = mine.find((l) => l.child_id === WANT)
                  || mine.find((l) => !done.has(l.child_id));
        if (!target) { location.replace("/report.html"); }
        else {
          childId = target.child_id;
          guardianId = target.guardians.id;
          childName = (target.children && target.children.display_name) || "우리 아이";
          // 이미 답이 있으면 이어서 고칠 수 있게 채워 넣는다(다시 처음부터 시키지 않는다)
          const prev = byChild.get(childId);
          if (prev) data = { ...prev };
          render();
        }
      }
    } catch (e) {
      state("⚠️","불러오지 못했어요", (e && e.message) || "잠시 후 다시 시도해 주세요.");
    }

    function render() {
      const step = STEPS[i], last = i === STEPS.length - 1;
      show(`
        <div class="hbar"><div class="hfill" style="width:${Math.round((i+1)/STEPS.length*100)}%"></div></div>
        <span class="eyebrow">${esc(childName)} · 가정 식습관 · ${step.eyebrow}</span>
        <h1 class="title">${step.title}</h1>
        <p class="lede">${step.lede}</p>
        <form id="hcForm">
          ${step.fields.map((f) => fieldHtml(f, data)).join("")}
          <div class="actions">
            ${i > 0 ? `<button type="button" class="btn btn-ghost" id="hcPrev">이전</button>` : ""}
            <button type="submit" class="btn btn-primary" id="hcNext">${last ? "다 됐어요 · 리포트 보기" : "다음"}</button>
          </div>
          <div class="msg" id="hcMsg" role="status" aria-live="polite"></div>
        </form>
        ${i === 0 ? `<p class="note">이 답은 <b>${esc(childName)}의 리포트를 우리 집 상황에 맞추는 기준값</b>으로 써요.
          맞고 틀림을 보는 검사가 아니고, 나중에 바꿀 수 있어요.</p>` : ""}`);

      const msg = $("hcMsg");
      const say = (t, ok) => { msg.className = "msg show" + (ok ? " ok" : ""); msg.textContent = t; };
      const prev = $("hcPrev");
      if (prev) prev.addEventListener("click", () => { collect(); i--; render(); });

      // 이 스텝의 답을 data 에 모은다. 반환값 = 안 고른 객관식 질문 목록
      function collect() {
        const missing = [];
        step.fields.forEach((f) => {
          if (f.type === "text") {
            const el = document.querySelector(`[data-f="${f.id}"]`);
            data[f.id] = (el && el.value || "").trim();
            return;
          }
          const el = document.querySelector(`input[name="${f.id}"]:checked`);
          if (el) data[f.id] = el.value; else missing.push(f.q);
        });
        return missing;
      }

      $("hcForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        // 객관식은 비워 두고 넘어가지 않는다 — 빈 칸을 '보통'으로 추측하면 리포트가 거짓이 된다
        const missing = collect();
        if (missing.length) { say(`아직 안 고른 항목이 있어요 — ${missing[0]}`); return; }
        if (!last) { i++; render(); return; }

        $("hcNext").disabled = true;
        say("저장하는 중…", true);
        // (child_id, guardian_id) 유니크 → upsert. 기준값이라 이력을 쌓지 않고 덮어쓴다.
        const { error } = await sb.from("child_home_profiles")
          .upsert({ child_id: childId, guardian_id: guardianId, answers: data, schema_version: "homecheck-v1" },
                  { onConflict: "child_id,guardian_id" });
        if (error) {
          $("hcNext").disabled = false;
          say("저장에 실패했어요. 잠시 후 다시 시도해 주세요. (" + (error.message || "") + ")");
          return;
        }
        done.add(childId);
        // 형제가 더 있으면 리포트로 밀어내지 않고 **다음 아이를 이어서** 받는다.
        // 여기서 놓치면 그 아이의 리포트는 기준값 없이 만들어진다.
        const next = mine.find((l) => !done.has(l.child_id));
        if (next) {
          const nm = (next.children && next.children.display_name) || "다음 아이";
          say(`${childName} 저장 완료! ${nm}의 답도 이어서 받을게요.`, true);
          setTimeout(() => location.replace("/homecheck.html?child=" + next.child_id), 1100);
          return;
        }
        say("저장했어요! 리포트로 이동합니다 🎉", true);
        setTimeout(() => location.replace("/report.html"), 800);
      });
    }
  }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>우리 아이 리포트 · Chewstep</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%84%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="/assets/css/site.css" />
<style>
  body { background:var(--bg-soft); }
  .rtop { background:#fff; border-bottom:1px solid var(--line); height:58px; position:sticky; top:0; z-index:10;
    display:flex; align-items:center; justify-content:space-between; padding:0 20px; }
  .rtop .brand { display:flex; align-items:center; gap:9px; font-weight:800; color:var(--ink); font-size:16px; text-decoration:none; }
  .rtop .brand .logo { width:28px;height:28px;border-radius:8px;background:linear-gradient(145deg,var(--brand),var(--brand-deep));display:grid;place-items:center;color:#fff;font-size:14px; }
  .rtop .out { font-size:13px; color:var(--ink-soft); text-decoration:none; border:1px solid var(--line); padding:7px 12px; border-radius:9px; }
  .rwrap { max-width:640px; margin:0 auto; padding:24px 18px 70px; }

  .state { text-align:center; color:var(--ink-soft); padding:60px 20px; }
  .state .em { font-size:34px; }
  .state h2 { color:var(--ink); font-size:19px; margin:14px 0 8px; }
  .state .btn { margin-top:18px; }

  .rhead { background:#fff; border:1px solid var(--line); border-radius:18px; padding:22px; box-shadow:var(--shadow-sm); margin-bottom:16px; }
  .rhead .who { display:flex; align-items:center; gap:12px; }
  .rhead .av { width:46px;height:46px;border-radius:13px;background:linear-gradient(145deg,var(--brand),var(--brand-deep));color:#fff;display:grid;place-items:center;font-weight:800;font-size:19px;flex:none; }
  .rhead .who b { display:block; color:var(--ink); font-size:18px; letter-spacing:-.01em; }
  .rhead .who span { font-size:12.5px; color:var(--ink-soft); }
  .rhead .period { margin-top:14px; font-size:12.5px; color:var(--ink-soft); background:var(--bg-soft); border:1px solid var(--line); border-radius:10px; padding:9px 12px; }

  .finding { background:#fff; border:1px solid var(--line); border-radius:16px; padding:18px 20px; box-shadow:var(--shadow-sm); margin-bottom:12px; }
  .finding .src { display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:800; padding:3px 10px; border-radius:999px; border:1px solid; margin-bottom:10px; }
  .finding .src::before { content:""; width:7px;height:7px;border-radius:50%; }
  .src-engine { color:var(--future); background:var(--future-tint); border-color:var(--future-line); }
  .src-engine::before { background:var(--future); }
  .src-teacher { color:var(--brand-deep); background:var(--brand-tint); border-color:#bfe6d5; }
  .src-teacher::before { background:var(--brand); }
  .src-guardian { color:var(--ink-2); background:var(--bg-soft); border-color:var(--line); }
  .src-guardian::before { background:var(--ink-soft); }
  .src-chewstep { color:#6b5518; background:var(--amber-tint); border-color:#f0e2bf; }
  .src-chewstep::before { background:var(--amber-dot); }
  .finding h3 { color:var(--ink); font-size:15.5px; margin-bottom:5px; }
  .finding p { font-size:14.5px; color:var(--ink-2); line-height:1.6; }
  .rnote { font-size:12px; color:var(--ink-soft); text-align:center; line-height:1.6; margin-top:18px; }
  .loading { text-align:center; color:var(--ink-soft); padding:70px 20px; }

  /* 식사 영상 — 보호자가 가장 먼저 찾는 것이라 리포트 맨 위에 둔다 */
  .vid { background:#fff; border:1px solid var(--line); border-radius:16px; padding:16px 18px 18px;
    box-shadow:var(--shadow-sm); margin-bottom:12px; }
  .vid h3 { color:var(--ink); font-size:15.5px; margin-bottom:4px; }
  .vid .sub { font-size:12.5px; color:var(--ink-soft); margin-bottom:12px; line-height:1.55; }
  .vid video { width:100%; border-radius:12px; background:#000; display:block; }
  .vid .vmsg { font-size:13px; color:var(--ink-soft); background:var(--bg-soft); border:1px solid var(--line);
    border-radius:10px; padding:12px 14px; line-height:1.55; }
  .vid .vwarn { background:var(--amber-tint); color:#6b5518; border-color:#f0e2bf; }

  /* 형제 전환 — 아이가 2명 이상일 때만 나온다 */
  .kids { display:flex; gap:8px; overflow-x:auto; padding:2px 0 14px; }
  .kid { flex:none; display:flex; align-items:center; gap:8px; background:#fff; border:1px solid var(--line);
    border-radius:999px; padding:7px 14px 7px 8px; font-size:13.5px; color:var(--ink-2); cursor:pointer; font-family:inherit; }
  .kid .av2 { width:26px;height:26px;border-radius:50%;background:var(--bg-soft);color:var(--ink-soft);
    display:grid;place-items:center;font-weight:800;font-size:12px; }
  .kid.on { border-color:var(--brand); background:var(--brand-tint); color:var(--ink); font-weight:700; }
  .kid.on .av2 { background:linear-gradient(145deg,var(--brand),var(--brand-deep)); color:#fff; }
</style>
</head>
<body>
<div class="rtop">
  <a class="brand" href="/"><span class="logo">🥣</span> Chewstep</a>
  <a class="out" id="logout" href="#">로그아웃</a>
</div>

<div class="rwrap">
  <div class="loading" id="loading">불러오는 중…</div>
  <div id="content" style="display:none;"></div>
</div>

<script type="module">
  import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
  const sb = createClient("https://qwfskemfsrkmlrdttvqy.supabase.co","sb_publishable_5cL015aIZo-fRKwXM16RkQ_NbzkzibH");

  const $ = (id) => document.getElementById(id);
  const esc = (s) => (s||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const SRC = {
    engine:{cls:"src-engine",label:"엔진 측정"}, teacher:{cls:"src-teacher",label:"교사 관찰"},
    guardian:{cls:"src-guardian",label:"보호자 입력"}, chewstep_reviewer:{cls:"src-chewstep",label:"코칭 제안"}
  };
  function ageMonths(bd){ if(!bd) return ""; const b=new Date(bd), n=new Date(2026,6,21);
    let m=(n.getFullYear()-b.getFullYear())*12+(n.getMonth()-b.getMonth()); return m>0? (" · 만 "+Math.floor(m/12)+"세"):""; }
  function show(html){ $("loading").style.display="none"; const c=$("content"); c.style.display="block"; c.innerHTML=html; }
  function state(em,title,desc,btn){ show(`<div class="state"><div class="em">${em}</div><h2>${esc(title)}</h2><p>${esc(desc)}</p>${btn||""}</div>`); }

  // 로그아웃
  $("logout").addEventListener("click", async (e)=>{ e.preventDefault(); await sb.auth.signOut(); location.replace("/login.html"); });

  /* ── 식사 영상 ────────────────────────────────────────────────────────────────
   * 영상 파일은 비공개 버킷에 있고, 재생에는 **엣지함수 get-report-media-url** 이 발급하는
   * 짧은 만료 서명 URL 이 필요하다. 그 함수가 확인하는 것:
   *   report_media.visible_to_guardian · report.status='published' · 자산 미삭제·허용타입
   *   · 호출자가 그 아이의 보호자 · **보호자 수신선택(delivery_type)과 자산 타입 일치**
   *
   * ⚠ 수신선택이 없으면 기본값이 analysis_only 라 영상이 거부된다(PREFERENCE_MISMATCH).
   *   그래서 homecheck 6단계에서 그 선택을 받는다. 여기서는 그 결과를 **보호자 말로 번역**한다 —
   *   "권한 없음" 같은 문구를 보호자에게 보여주지 않는다.
   *
   * URL 은 어디에도 저장하지 않는다(요청할 때마다 새로 발급). 클립은 30초 안팎이라
   * TTL 900초로 충분하므로 앱(watch.js)처럼 선제 재발급은 하지 않는다.
   */
  const FN = "https://qwfskemfsrkmlrdttvqy.supabase.co/functions/v1/get-report-media-url";
  const VID_ERR = {
    PREFERENCE_MISMATCH: "영상 없이 받기로 선택하셨어요. 더보기에서 영상 받기로 바꿀 수 있어요.",
    NOT_VISIBLE:  "이 영상은 아직 공개 준비 중이에요.",
    NOT_PUBLISHED:"리포트가 아직 발행되지 않았어요.",
    ASSET_DELETED:"보관 기간이 지나 영상이 삭제됐어요.",
    NOT_GUARDIAN: "이 아이의 영상을 볼 권한이 확인되지 않아요.",
  };
  // report_media.media_role 의 CHECK 허용값은 meal_video · thumbnail · highlight_clip 뿐이다.
  // (처음엔 chewing_clip 같은 없는 값을 적어 두어 라벨이 항상 기본값으로 떨어졌다 — 2026-08-11 수정)
  const ROLE_LABEL = { meal_video:"식사 영상", highlight_clip:"식사 장면", thumbnail:"식사 사진" };

  async function loadVideo(reportId) {
    const slot = $("vidSlot");
    if (!slot) return;
    // 보호자에게 공개된 미디어만. 여러 개면 display_order 순으로 첫 번째를 쓴다.
    const { data: media, error } = await sb.from("report_media")
      .select("id, media_role, display_order, media_assets(asset_type, duration_seconds)")
      .eq("report_id", reportId).eq("visible_to_guardian", true)
      .order("display_order", { ascending:true }).limit(1);
    if (error || !media || !media.length) return;   // 영상이 없으면 자리 자체를 만들지 않는다

    const m = media[0];
    const a = m.media_assets || {};
    const label = ROLE_LABEL[m.media_role] || "식사 영상";
    const secs = a.duration_seconds ? ` · ${Math.round(a.duration_seconds)}초` : "";
    slot.innerHTML = `<div class="vid"><h3>🎬 ${esc(label)}${secs}</h3>
      <p class="sub">불러오는 중…</p></div>`;

    let res, body = {};
    try {
      const { data:{ session } } = await sb.auth.getSession();
      res = await fetch(FN, {
        method: "POST",
        headers: { "Content-Type":"application/json",
                   apikey: "sb_publishable_5cL015aIZo-fRKwXM16RkQ_NbzkzibH",
                   Authorization: "Bearer " + (session ? session.access_token : "") },
        body: JSON.stringify({ report_media_id: m.id }),
      });
      body = await res.json().catch(() => ({}));
    } catch (e) {
      slot.innerHTML = `<div class="vid"><h3>🎬 ${esc(label)}</h3>
        <div class="vmsg">지금은 영상을 불러올 수 없어요. 잠시 후 다시 열어 주세요.</div></div>`;
      return;
    }
    if (!res.ok || !body.url) {
      const msg = VID_ERR[body.error] || "지금은 영상을 불러올 수 없어요.";
      const warn = body.error === "PREFERENCE_MISMATCH" ? " vwarn" : "";
      slot.innerHTML = `<div class="vid"><h3>🎬 ${esc(label)}</h3>
        <div class="vmsg${warn}">${esc(msg)}</div></div>`;
      return;
    }
    slot.innerHTML = `<div class="vid">
      <h3>🎬 ${esc(label)}${secs}</h3>
      <p class="sub">보호자에게만 보이는 영상이에요. 다른 아이의 얼굴·목소리는 담기지 않게 편집했습니다.</p>
      <video controls playsinline preload="metadata" src="${esc(body.url)}"></video>
    </div>`;
  }

  // 1) 인증 게이트
  const { data:{ session } } = await sb.auth.getSession();
  if (!session) { location.replace("/login.html?next=/report.html"); }
  else {
    try {
      // 2) 내 아이(연결된 child_guardians → children). RLS로 본인 것만 반환.
      //    ⚠ 형제가 있으면 여러 행이다 — 코드가 아이 한 명당 하나라 보호자가 코드를 여러 번 넣는다.
      //      예전에는 links[0] 만 써서 **둘째부터는 영영 보이지 않았다**(2026-08-08 수정).
      //    ⚠ 같은 아이가 두 줄로 올 수도 있다(child_guardians RLS 가 같은 아이의 다른 보호자 행까지 보여준다)
      //      → 아이 기준으로 접는다.
      const { data:links, error:e1 } = await sb.from("child_guardians")
        .select("child_id, children(display_name, birth_date)");
      if (e1) throw e1;
      const seen = new Set();
      const kids = (links || [])
        .filter((l) => l.child_id && l.children && !seen.has(l.child_id) && seen.add(l.child_id))
        .sort((a,b) => (a.children.display_name||"").localeCompare(b.children.display_name||"", "ko"));

      if (!kids.length) {
        state("🔗","아직 연결된 아이가 없어요","어린이집에서 받은 초대 코드로 우리 아이를 연결해 주세요.",
          '<a class="btn btn-primary" href="/redeem.html">초대 코드 입력하기 →</a>');
      } else {
        // 보고 있던 아이를 기억한다. 저장값이 더 이상 내 아이가 아니면(연결 해제 등) 첫째로 되돌린다.
        const KEY = "cs_child";
        const want = new URLSearchParams(location.search).get("child") || localStorage.getItem(KEY) || "";
        const link = kids.find((k) => k.child_id === want) || kids[0];
        try { localStorage.setItem(KEY, link.child_id); } catch (e) {}
        const child = link.children || {};

        // 형제 전환 칩 — 1명이면 만들지 않는다(없는 선택지를 보여주지 않는다)
        // data-journey 를 명시해 여정 로그에 아이 이름이 들어가지 않게 한다 —
        // 라벨이 없으면 journey.js 가 버튼 텍스트(= 아이 이름)를 남긴다.
        // data-journey-private 는 이 안에 앞으로 무엇이 추가돼도 텍스트가 안 새게 하는 이중 잠금.
        const kidsBar = kids.length < 2 ? "" :
          `<div class="kids" data-journey-private>` + kids.map((k) => {
            const n = esc(k.children.display_name || "아이");
            return `<button class="kid${k.child_id===link.child_id?" on":""}" data-kid="${k.child_id}"`
                 + ` data-journey="report:switch-child">`
                 + `<span class="av2">${n.slice(0,1)}</span>${n}</button>`;
          }).join("") + `</div>`;

        // 2-b) 가정 식습관 체크 게이트 (2026-08-08)
        //   기준값이 없으면 리포트를 우리 집 상황에 맞출 수 없다. 연결 직후가 아니면 회수되지 않으므로
        //   여기서 한 번 더 보낸다. **보고 있는 아이 기준**으로 판단한다 — 첫째만 답하고 둘째는 안 답한 경우가 있다.
        //   조회 실패(네트워크·권한)는 게이트로 쓰지 않는다 — 못 읽었다는 이유로 이미 답한 보호자를 설문으로 되돌리면 안 된다.
        const { data: hp, error: eHp } = await sb.from("child_home_profiles")
          .select("child_id").eq("child_id", link.child_id).limit(1);
        if (!eHp && (!hp || hp.length === 0)) { location.replace("/homecheck.html?child=" + link.child_id); }
        else {

        // 3) 발행된 최신 리포트
        const { data:reps, error:e2 } = await sb.from("reports")
          .select("id, published_at, report_type").eq("child_id", link.child_id)
          .eq("status","published").order("published_at",{ascending:false}).limit(1);
        if (e2) throw e2;
        const nm = esc(child.display_name || "우리 아이");
        // 아이를 바꾸면 그 아이 리포트로 다시 그린다(선택은 위에서 localStorage 에 남는다)
        const bindKids = () => document.querySelectorAll("[data-kid]").forEach((b) =>
          b.addEventListener("click", () => {
            try { localStorage.setItem(KEY, b.getAttribute("data-kid")); } catch (e) {}
            location.replace("/report.html?child=" + b.getAttribute("data-kid"));
          }));
        if (!reps || reps.length===0) {
          show(kidsBar + `<div class="state"><div class="em">🍽️</div><h2>${nm} 리포트 준비 중</h2>`
             + `<p>아직 발행된 리포트가 없어요. 관찰이 쌓이면 이곳에 리포트가 도착합니다.</p></div>`);
          bindKids();
        } else {
          const rep = reps[0];
          const { data:fs, error:e3 } = await sb.from("report_findings")
            .select("finding_type, source_type, title, content, display_order")
            .eq("report_id", rep.id).order("display_order");
          if (e3) throw e3;
          // 빈 리포트를 그대로 노출하지 않는다 (2026-08-08 실연에서 발견).
          // 발행됐지만 findings 가 0행이면 보호자는 제목만 있는 화면을 본다 —
          // 그건 '리포트가 없는 것'이지 '내용이 없는 리포트'가 아니다.
          if (!fs || fs.length === 0) {
            show(kidsBar + `<div class="state"><div class="em">🍽️</div><h2>${nm} 리포트 준비 중</h2>`
               + `<p>리포트를 다듬고 있어요. 준비되면 다시 알려드릴게요.</p></div>`);
            bindKids();
          } else {
          const when = rep.published_at ? new Date(rep.published_at).toLocaleDateString("ko-KR") : "";
          const RTYPE = { single_meal:"한 끼 리포트", multi_day:"주간 리포트", coaching:"코칭 리포트" };
          const rtLabel = RTYPE[rep.report_type] || "리포트";
          let html = kidsBar + `<div class="rhead"><div class="who"><div class="av">${nm.slice(0,1)}</div>`
            + `<div><b>${nm} 식사 리포트</b><span>${esc(rtLabel)}${ageMonths(child.birth_date)}</span></div></div>`
            + (when? `<div class="period">📅 발행일 ${when}</div>`:``) + `</div>`;
          // 영상 자리를 먼저 만들어 둔다 — 서명 URL 발급은 비동기라 리포트 렌더를 기다리게 하지 않는다.
          // ⚠ 위치: PRD v0.4 §14-4 순서에서 영상은 5번이지만, 이 화면은 findings 를 순서대로 재배열할 수
          //    없는 단순 목록이다. 보호자가 가장 먼저 찾는 것이라 맨 위에 둔다.
          //    제대로 된 순서는 리포트 생성 도구가 나오면 그쪽에서 잡는다.
          html += `<div id="vidSlot"></div>`;
          (fs||[]).forEach(f=>{
            const s = SRC[f.source_type] || {cls:"src-guardian",label:f.source_type||"기타"};
            html += `<div class="finding"><span class="src ${s.cls}">${s.label}</span>`
              + `<h3>${esc(f.title)}</h3><p>${esc(f.content)}</p></div>`;
          });
          html += `<p class="rnote">측정·관찰·해석의 출처를 구분해 보여드립니다. 해석은 단정이 아닌 추정이며, 다음 기록에서 계속 관찰합니다.<br>· Chewstep은 의료 진단이 아닙니다 ·</p>`;
          show(html);
          bindKids();
          loadVideo(rep.id);
          }   // findings 있음
        }     // 발행본 있음
        }     // 가정 식습관 체크 완료
      }
    } catch (err) {
      state("⚠️","리포트를 불러오지 못했어요", (err && err.message) ? err.message : "잠시 후 다시 시도해 주세요.");
    }
  }
</script>
